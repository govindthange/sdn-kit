<!DOCTYPE html>
<meta name="robots" content="noindex">
<html>
	<head>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/3.5.6/d3.min.js"></script>
	  <meta charset="utf-8">
	  <meta name="viewport" content="width=device-width">
	  <title>JS Bin</title>
	  <style>
		.nodeLegend {
			font-size: 0.75em;
		}
		
		image {
		  width: 64px;
		  height: 64px;
		  transform: translate(-32px,-32px);
		}
		
		.link {
		  stroke: #aaa;
		}

		.node text {
			stroke:#333;
			cursos:pointer;
		}

		.node circle{
			stroke:#fff;
			stroke-width:3px;
			fill:#555;
		}
	  </style>
	</head>
<body>

	<svg id="networkGraphId" />
		
	<script>
		var outerWidth = 600;
		var outerHeight = 250;
		var rMin = 5;
		var rMax = 20;
		var marginLeft = 10;
		var marginTop = 10;
		var marginRight = 10;
		var marginBottom = 10;
		var innerWidth = outerWidth - marginLeft - marginRight;
		var innerHeight = outerHeight - marginTop - marginBottom;
		
		var svg = d3.select('#networkGraphId')
					.attr("background-color", "yellow")
					.attr("width", outerWidth)
					.attr("height", outerHeight);
		
		var g = svg.append('g')
					.attr("transform", "translate("+marginLeft+","+marginTop+")");
		
		var force = d3.layout.force()
					.gravity(.05)
					.distance(200)
					.charge(-100)
					.size([innerWidth, innerHeight]);
		
		d3.json("map.json", function(err, data) {
			update(data);
		});
		 
		function update(json) {	
			force
				.nodes(json.nodes)
				.links(json.links)
				.start();

		
			// Bind Data
			var networkLinks = g.selectAll('.link').data(json.links);
			var networkNodes = g.selectAll('.node').data(json.nodes);
			
			// Enter
			networkLinks
				.enter()
					.append("line")
						.attr("class", "link")
						.call(force.drag);
			networkNodes
				.enter()
					.append("g")
						.attr("class", "node")
						.style("stroke-width", function(d) { return Math.sqrt(d.weight); });
			
						
			networkNodes.append("circle")
				.attr("r", "5");
				
			networkNodes.append("image")
				.attr("xlink:href", function(d) {
										if (d.device === 'host') {return "./images/host.png";}
										else if (d.device === 'server') {return "./images/server.png";}
										else if (d.device === 'firewall') {return "./images/firewall-horizontal.png";}
										else if (d.device === 'switch') {return "./images/switch.png";}
										else if (d.device === 'wireless_router') {return "./images/wireless-router.png";}
										else if (d.device === 'router') {return "./images/router.png";}
										
										return null;
									})
				/*.attr("transform", "translate(-16,-16)")*/;
			networkNodes.append("text")
				.attr("class", "nodeLegend")
				//.attr("dx", ".15em")
				.attr("dx", -35)
				.attr("dy", 35)
				.text(function(d) { return d.name;});
				
				
			force.on("tick", function() {
				networkLinks
					.attr("x1", function(d) { return d.source.x; })
					.attr("y1", function(d) { return d.source.y; })
					.attr("x2", function(d) { return d.target.x; })
					.attr("y2", function(d) { return d.target.y; });

				networkNodes.attr("transform", function(d) { return "translate(" + d.x + "," + d.y + ")"; });
			});
			
		}
		
		// http://bl.ocks.org/jose187/4733747q
		// http://bl.ocks.org/mbostock/1153292
		// http://bl.ocks.org/mbostock/raw/1153292/
	</script>
</body>
</html>
