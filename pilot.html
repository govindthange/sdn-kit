<!DOCTYPE html>
<meta name="robots" content="noindex">
<html>
	<head>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/3.5.6/d3.min.js"></script>
	  <meta charset="utf-8">
	  <meta name="viewport" content="width=device-width">
	  <title>JS Bin</title>
	  <style>
		.nodeLegend {
			font-size: 0.75em;
		}
		
		image {
		  width: 64px;
		  height: 64px;
		  transform: translate(-32px,-32px);
		}
		
		line {
			fill: none;
			stroke-width: 1px;
		}
		.link-path {
		  stroke: #aaa;
		}
		
		path {
			fill: none;
			stroke-width: 1px;
		}
		.route-path {
		  stroke: red;
		  stroke-width: 2;
		  stroke-linecap: "round";
		  stroke-dasharray: 5 5;
		}
		.hop-path {
		  stroke: green;/*#ffff00;*/
		  stroke-width: 1;
		}

		.node text {
			stroke:#333;
			cursos:pointer;
		}

		.node circle {
			stroke:#fff;
			stroke-width:3px;
			fill:#555;
		}
	  </style>
	</head>
<body>

	<svg id="networkGraphId" />
		
	<script>
		var outerWidth = 700;
		var outerHeight = 400;
		var rMin = 5;
		var rMax = 20;
		var marginLeft = 75;
		var marginTop = 75;
		var marginRight = 75;
		var marginBottom = 75;
		var innerWidth = outerWidth - marginLeft - marginRight;
		var innerHeight = outerHeight - marginTop - marginBottom;
		
		var svg = d3.select('#networkGraphId')
					.attr("background-color", "yellow")
					.attr("width", outerWidth)
					.attr("height", outerHeight);
		
		var g = svg.append('g')
					.attr("transform", "translate("+marginLeft+","+marginTop+")");
		
		var force = d3.layout.force()
					.gravity(.05)
					.distance(200)
					.charge(-200)
					.size([innerWidth, innerHeight]);
			
		d3.json("network.json", function(err, data) {
			update(data);
		});
		
		var x = d3.scale.linear().domain([0, 10]).range([0, 700]);
		var y = d3.scale.linear().domain([0, 10]).range([10, 290]);
		var lineFn = d3.svg.line()
					.interpolate("base")
					.x(function(d,i) {return x(i);})
					.y(function(d) {return y(d);})
		
		var freeLineFn = d3.svg.line()
					.interpolate("base")
					.x(function(d,i) {return d.x;})
					.y(function(d) {return x.y;})
					
		var diagonalFn = d3.svg.diagonal().projection(function(d) { return [d.x, d.y]; });
		
		var curveFn = function(d) {
							var dx = d.target.x - d.source.x,
								dy = d.target.y - d.source.y,
								dr = Math.sqrt(dx * dx + dy * dy);
								
							return "M" + 
								d.source.x + "," + 
								d.source.y + "A" + 
								dr + "," + dr + " 0 0,1 " + 
								d.target.x + "," + 
								d.target.y;
						};
		 
		function update(json) {	
			force
				.nodes(json.nodes)
				.links(json.links)
				.alpha(0)
				.start();
			
		// Per-type markers, as they don't inherit styles.
		svg.append("defs").selectAll("marker")
			.data(["link", "route", "hop"])
		  .enter().append("marker")
			.attr("id", function(d) { return d; })
			.attr("viewBox", "0 -5 10 10")
			.attr("refX", 15)
			.attr("refY", -1.5)
			.attr("markerWidth", 6)
			.attr("markerHeight", 6)
			.attr("orient", "auto")
		  .append("path")
			.attr("d", "M0,-5L10,0L0,5");
			
			var n=50;
			for (var i = n * n; i > 0; --i) force.tick();
			force.stop();
			
		
			// Bind Data based on filter (separate links based on connecting line type)
			var networkLinks = g.selectAll('.link-path').data(json.links.filter(function(d) { return d.type === 'link'; }));
			var networkPaths = g.selectAll('.route-path').data(json.links.filter(function(d) { return d.type === 'route'; }));
			var networkHops = g.selectAll('.hop-path').data(json.links.filter(function(d) { return d.type === 'hop'; }));
			var networkNodes = g.selectAll('.node').data(json.nodes);
			
			// Enter
			networkLinks
				.enter()
					.append("line")
						.attr("class", "link-path")
						.call(force.drag);
			networkNodes
				.enter()
					.append("g")
						.attr("class", "node")
						.style("stroke-width", function(d) { return Math.sqrt(d.weight); });
			
			networkPaths
				.enter()
					.append("path")
						.attr("d", diagonalFn)
						.attr("class", "route-path")
						.call(force.drag)
						.attr("marker-end", function(d) { return "url(#" + d.type + ")"; });
			
			networkHops
				.enter()
					.append("path")
						.attr("d", curveFn)
						.attr("class", "hop-path")
						.call(force.drag)
						.attr("marker-end", function(d) { return "url(#" + d.type + ")"; });
						//.attr("marker-end", "url(#end)");;
						
			var n = networkNodes.length;
			networkNodes.forEach(function(d, i) {
			  d.x = 10;//d.y = innerWidth / n * i;
			});
			
			
			networkNodes.append("circle")
				.attr("cx", function(d) { return d.x; })
				.attr("cy", function(d) { return d.y; })
				.attr("r", "5");
			/*	
			networkNodes.append("image")
				.attr("x", function(d) { return d.x; })
				.attr("y", function(d) { return d.y; })
				.attr("xlink:href", function(d) {
										if (d.device === 'host') {return "./images/host.png";}
										else if (d.device === 'server') {return "./images/server.png";}
										else if (d.device === 'firewall') {return "./images/firewall-horizontal.png";}
										else if (d.device === 'switch') {return "./images/switch.png";}
										else if (d.device === 'wireless_router') {return "./images/wireless-router.png";}
										else if (d.device === 'router') {return "./images/router.png";}
										
										return null;
									})
			*/		
			networkNodes.append("text")
				.attr("x", function(d) { return d.x; })
				.attr("y", function(d) { return d.y; })
				.attr("class", "nodeLegend")
				.attr("dx", -35)
				.attr("dy", 35)
				.text(function(d) { return d.name;});
			
			networkLinks
					.attr("x1", function(d) { return d.source.x; })
					.attr("y1", function(d) { return d.source.y; })
					.attr("x2", function(d) { return d.target.x; })
					.attr("y2", function(d) { return d.target.y; });
			networkPaths
					.attr("x1", function(d) { return d.source.x; })
					.attr("y1", function(d) { return d.source.y; })
					.attr("x2", function(d) { return d.target.x; })
					.attr("y2", function(d) { return d.target.y; });
			networkHops
					.attr("x1", function(d) { return d.source.x; })
					.attr("y1", function(d) { return d.source.y; })
					.attr("x2", function(d) { return d.target.x; })
					.attr("y2", function(d) { return d.target.y; });
		}
		
		// http://bl.ocks.org/jose187/4733747q
		// http://bl.ocks.org/mbostock/1153292
		// http://bl.ocks.org/mbostock/raw/1153292/
	</script>
</body>
</html>
