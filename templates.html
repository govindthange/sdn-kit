<!DOCTYPE html>
<meta charset="utf-8">
<style>
	body, html {
        width: 100%;
        height: 100%;
        margin: 0;
      }
     
      p {
        text-align: center;
      }
.link {
  fill: none;
  stroke: #666;
  stroke-width: 1.5px;
}

#errorRouteMarkerId {
  fill: none;
  stroke: red;
  stroke-width: 1;
}
.link.errorRoute {
  stroke: red;
  stroke-width: 2;
  stroke-opacity: 0.4;
  stroke-dasharray: 0,2 1;
}

#congestedRouteMarkerId {
  fill: orange;
}
.link.congestedRoute {
	stroke: orange;
	stroke-width: 2;
}

#testRoute1MarkerId {
  fill: none;
  stroke: red;
  stroke-width: 1;
}
.link.testRoute1 {
  stroke: green;
  stroke-width: 2;
  stroke-dasharray: 0,2 1;
}

circle {
  fill: #ccc;
  stroke: #333;
  stroke-width: 1.5px;
}

text {
  font: 10px sans-serif;
  pointer-events: none;
  text-shadow: 0 1px 0 #fff, 1px 0 0 #fff, 0 -1px 0 #fff, -1px 0 0 #fff;
}

.systemReading {
  fill: blue;
  font: 8px sans-serif;
  pointer-events: none;
}

</style>
